# Author: Alex Hua
# Homepage: https://www.aria2e.com
# Reference: https://aria2.github.io/manual/en/html/aria2c.html

#console-log-level=debug

#本地使用没必要配置secret
#rpc-secret=

enable-rpc=true

# UPnP Port Mapping
enable-pmap=true

#允许在线版 ARIA2 前端，通过https/wss协议管理本地Aria2
rpc-allow-origin-all=true

#允许局域网主机通过IPv4(或广域网主机通过IPV6)管理本地Aria2（危险，不理解请勿打开）
rpc-listen-all=false

rpc-listen-port=6800

# 是否启用 RPC 服务的 SSL/TLS 加密，启用加密后需要使用 HTTPS/WSS 协议连接 RPC 服务
#rpc-secure=true

# 在 RPC 服务中启用 SSL/TLS 加密时的证书文件(.pem/.crt)(Windows平台只支持pfx格式证书)
#rpc-certificate=server.pfx

# 在 RPC 服务中启用 SSL/TLS 加密时的私钥文件(.key)
#rpc-private-key=server.key

max-concurrent-downloads=10

continue=true

max-connection-per-server=10

min-split-size=1M

split=8

#max-overall-download-limit=0

#max-download-limit=0

max-tries = 3

#上传速度限制
max-overall-upload-limit=1M

#单文件速度限制
#max-upload-limit=0

#lowest-speed-limit=0

#referer=pan.baidu.com/disk/home

#user-agent=netdisk

#默认下载路径
dir=D:\Downloads

#代理服务器设置
#all-proxy = http://127.0.0.1:8080

disk-cache=256M

#所需时间 none < trunc = falloc « prealloc。 
#falloc最优，但需要Aria2以管理员身份运行。
#trunc只标记文件大小，不预分配空间，并不能减少磁盘碎片产生。
#默认prealloc方式顺序地向磁盘中写 0，直到写入量达到下载文件的大小，
#当遇到大文件时会导致严重的性能问题，Aria2在下载大文件时会假死一段时间。
file-allocation=trunc

#下载任务信息保存
input-file=${HOME}/AppData/Local/Aria2 Manager/aria2.session
save-session=${HOME}/AppData/Local/Aria2 Manager/aria2.session
save-session-interval=3
auto-save-interval=3

# 强制保存会话, 即使任务已经完成, 默认:false
# 较新的版本开启后会在任务完成后依然保留.aria2 文件
force-save=true

no-netrc=true
netrc-path=${HOME}/AppData/Local/Aria2 Manager/.netrc

#文件名相关
content-disposition-default-utf8=true
auto-file-renaming=false

## HTTP##
timeout=10
http-accept-gzip=true
#enable-http-keep-alive=true
#enable-http-pipelining=true

## BT/PT 下载相关 ##

# 当下载的是一个种子(以.torrent 结尾)时, 自动开始 BT 任务, 默认:true
# follow-torrent=true

# BT 监听端口, 当端口被屏蔽时使用, 默认:6881-6999
listen-port=6885-6889

# 单个种子最大连接数, 默认:55
# bt-max-peers=55

# 打开 DHT 功能, PT 需要禁用, 默认:true
enable-dht=true
dht-file-path=${HOME}/AppData/Local/Aria2 Manager/dht.dat

# 打开 IPv6 DHT 功能, PT 需要禁用
enable-dht6=true
dht-file-path6=${HOME}/AppData/Local/Aria2 Manager/dht6.dat

# 设置 IPv4 DHT 网络入口点
dht-entry-point=dht.transmissionbt.com:6881

# 设置 IPv6 DHT 网络入口点
dht-entry-point6=dht.transmissionbt.com:6881

# DHT 网络监听端口, 默认:6881-6999
dht-listen-port=6995-6999

# 本地节点查找, PT 需要禁用, 默认:false
bt-enable-lpd=true

# 种子交换, PT 需要禁用, 默认:true
# enable-peer-exchange=false

# 每个种子限速, 对少种的 PT 很有用, 默认:50K
# bt-request-peer-speed-limit=50K

# 客户端伪装, PT 需要
peer-id-prefix=-AE2500-
peer-agent=Aria2Explorer/2.5.0

# 当种子的分享率达到这个数时, 自动停止做种, 0 为一直做种, 默认:1.0
seed-ratio=1.0

# 计算活跃任务数时不计算正在做种的任务
bt-detach-seed-only=true

# BT 校验相关, 默认:true
# bt-hash-check-seed=true

# 继续之前的 BT 任务时, 无需再次校验, 默认:false
#  bt-seed-unverified=false

# 保存磁力链接元数据为种子文件(.torrent 文件), 默认:false
bt-save-metadata=true
bt-load-saved-metadata=true

bt-remove-unselected-file=true
bt-prioritize-piece=head=10M
seed-time=30
bt-tracker-connect-timeout=8
